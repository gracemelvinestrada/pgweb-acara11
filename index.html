
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGIS Kabupaten Sukoharjo</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background: #d31d81;
            color: white;
            padding: 12px 20px;
        }

        header h2 {
            margin: 0;
        }

        header p {
            margin: 5px 0 0;
        }

        #map {
            width: 100%;
            height: calc(100vh - 75px);
        }
    </style>
</head>

<body>

    <header>
        <h2>WebGIS Kabupaten Sukoharjo</h2>
    </header>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Leaflet GeoServer Request -->
    <script src="https://unpkg.com/leaflet-geoserver-request@1.3.0/src/L.Geoserver.js"></script>

    <script>
        // =====================================
        // 1. INISIALISASI PETA
        // =====================================

        var map = L.map("map").setView([-7.680001938580462, 110.8224387859876], 12);


        // =====================================
        // 2. BASEMAP
        // =====================================

        // OpenStreetMap
        var osm = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap"
            }
        ).addTo(map);


        // Esri Street Map
        var esriStreet = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
            {
                attribution: "Tiles &copy; Esri"
            }
        );


        // Esri Satellite
        var esriSatellite = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                attribution: "Tiles &copy; Esri"
            }
        );


        // Label untuk Esri Hybrid
        var esriLabels = L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"
        );


        // Esri Hybrid
        var esriHybrid = L.layerGroup([
            esriSatellite,
            esriLabels
        ]);


        // =====================================
        // 3. KONEKSI GEOSERVER
        // =====================================

        var geoserver = "http://localhost:8080/geoserver/wms";


        // =====================================
        // 4. LAYER JUMLAH PENDUDUK
        // =====================================

        var wmsLayer1 = L.Geoserver.wms(geoserver, {
            layers: "pgweb:jumlah_pddk_skh",
            transparent: true,
            format: "image/png",
            style: "simbologi_jml_pddk",
            zIndex: 1001
        });

        wmsLayer1.addTo(map);


        // =====================================
        // 5. LAYER JARINGAN JALAN
        // =====================================

        var wmsLayer2 = L.Geoserver.wms(geoserver, {
            layers: "pgweb:jalan_skh",
            transparent: true,
            format: "image/png",
            zIndex: 1003
        });

        wmsLayer2.addTo(map);


        // =====================================
        // 6. LEGENDA JUMLAH PENDUDUK
        // =====================================

        var layerLegend = L.Geoserver.legend(geoserver, {
            layers: "pgweb:jumlah_pddk_skh",
            style: "simbologi_jml_pddk"
        });

        layerLegend.addTo(map);


        // =====================================
        // 7. KONTROL BASEMAP DAN OVERLAY
        // =====================================

        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri Street Map": esriStreet,
            "Esri Satellite": esriSatellite,
            "Esri Hybrid": esriHybrid
        };

        var overlayMaps = {
            "Jumlah Penduduk": wmsLayer1,
            "Jaringan Jalan": wmsLayer2
        };

        L.control.layers(
            baseMaps,
            overlayMaps,
            {
                collapsed: true
            }
        ).addTo(map);


        // =====================================
        // 8. SKALA PETA
        // =====================================

        L.control.scale({
            imperial: false
        }).addTo(map);


        // =====================================
        // 9. MEMPERTAHANKAN LAYER JALAN DI ATAS
        // =====================================

        map.on("overlayadd", function () {
            wmsLayer2.bringToFront();
        });

        map.on("baselayerchange", function () {
            wmsLayer2.bringToFront();
        });

    </script>

</body>
</html>
